name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (Python ${{ matrix.python-version }})
    # macOS 14 images are retired; macos-15 is the current arm64 (Apple silicon)
    # label, which matches the MLX/`say` runtime this project targets.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit-message checks need the actual history of the PR or push.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install package without runtime model dependencies
        # Unit tests do not need MLX, Whisper, or Kokoro; skipping runtime deps
        # keeps CI fast and avoids multi-gigabyte model wheels.
        run: uv pip install --python .venv/bin/python --no-deps -e .

      - name: Install lightweight dependencies used by unit tests
        run: uv pip install --python .venv/bin/python 'platformdirs>=4.0'

      - name: Lint
        run: uvx ruff@0.17.6 check src/reachreel tests scripts

      - name: Commit messages
        # Conventional Commits in English, as declared in AGENTS.md.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..HEAD"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          echo "Checking commit messages in $RANGE"
          python3 scripts/check_commit_messages.py --range "$RANGE"

      - name: Language gate (no CJK in Python source)
        # Localized copy lives in locales/*.toml and prompts/*.toml only. Running
        # this test on its own keeps the failure message focused on the file and
        # line instead of burying it in the full suite output.
        run: >-
          .venv/bin/python -m unittest
          tests.unit.test_i18n_prompts.I18nPromptTests.test_no_cjk_in_python_source -v

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build
