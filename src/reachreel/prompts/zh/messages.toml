# Chinese content fallbacks and labels.

[vlm]
no_frames = "第 {id} 个场景（{start:.1f}-{end:.1f}s），无可用关键帧"
unknown = "未知"
context_label = "已知背景：{context}\n"
analysis_failed = "画面分析失败"
scene_failed = "第 {id} 个场景（画面分析失败）"

[script.table]
place = "地点：{value}"
description = "描述：{value}"
subjects = "主体：{value}"
actions = "动作：{value}"
details = "细节：{value}"
mood = "情绪：{value}"
angle = "可写角度：{value}"
none = "无"

[styles]
oral = "真人口语聊天感：像跟朋友面对面分享刚才拍到的画面，用大白话和短句（多用“你看”“其实”“说真的”“一下子”等自然连接词），禁止文言虚词、排比句和散文诗比喻。"
casual = "轻松随拍 Vlog 语气：语气松弛、带点生活感和情绪起伏，像边走边随口吐槽或感叹，句子短而有节奏，不端着、不煽情。"
literary = "克制细腻的书面散文风：注重画面留白、意象和节奏感，用凝练优雅的书面语表达，适合慢节奏风景片，但不要堆砌空洞形容词。"
documentary = "纪录片旁白风：冷静、客观、沉稳有力，句式完整清晰，重在交代环境变化、空间关系和人物动作细节，不夸张、不闲聊。"
commentary = "高节奏解说口播：开头有抓人的切入点，每段带一点推进感和看点提示，像经验丰富的视频作者在带观众看重点，信息密但不啰嗦。"

[style_guidance]
oral = """口语写稿规范：
- 每句尽量控制在 6-14 字，多用口语词（如“说实话”“你看”“一下子”“差点”“其实”），读起来要像真人随口说出来的话，不要像播音员念稿或写作文。
- 禁用书面/文言表达（如“之、于、似、如……低语/未尽之语/自……升腾”），禁用连续排比和散文诗比喻。
- 反例（太书面，不要写）：“红伞颤于风中，水雾裹寒，自悬崖升腾。”
- 正例（自然口语，参考这种感觉）：“风实在太大了，雨伞都快被吹翻过去，水雾扑在脸上凉飕飕的。”"""
casual = """随拍 Vlog 写稿规范：
- 用第一反应和聊天口吻表达，允许自然感叹和轻度自嘲，句子短促有力，有停顿感。
- 避免播音腔和“让我们一起”“太美了”这类空泛套话。"""
literary = """书面散文写稿规范：
- 保留书面语的克制与凝练，注重节奏、留白和具体意象，但依然要贴合真实可见的画面，不要无中生有。"""
documentary = """纪录片写稿规范：
- 保持客观、冷静、准确的书面解说风格，交待清楚时间、环境、主体动作与空间变化，语气克制不过度煽情。"""
commentary = """解说口播写稿规范：
- 开头 3 秒直接抛出画面亮点，段落之间有明显推进感，用口语化的解说句式把观众注意力带到关键细节上。"""
custom = """风格遵循要求：
- 严格按照上方指定风格来写，保证用词、句式和语气始终统一，念起来顺口、不别扭。"""

[script]
context_label = "视频背景：{context}\n"
fallback_intro = "风从山谷里穿过，画面慢慢往前展开。"
fallback_start = "画面从安静的风景里开始。"
condense_instruction = "下面是一版中文视频旁白，总字数偏多。请在不丢失画面信息、不编造内容的前提下压缩到约 {target_chars} 字，保留口吻、段落顺序和 JSON 格式：\n"
condense_ending = "\n只输出 JSON 数组，格式为 [{\"scene_ids\":[1,2],\"text\":\"...\"}]。"
expand_instruction = "下面是一版中文视频旁白，字数偏少，而且可能没有覆盖到片尾。请在不编造画面信息的前提下扩写到约 {target_chars} 字（视频 {duration:.1f} 秒），增加对画面细节、动作和环境变化的描述；按时间顺序补足中后段，最后一段要落在视频结束前 5-12 秒。保留口吻和 JSON 格式：\n"
expand_ending = "\n只输出 JSON 数组，格式为 [{\"scene_ids\":[1,2],\"text\":\"...\"}]。"
polish_instruction = "请把下面这版中文视频旁白改写成更适合真人直接开口配音的口语版本。\n要求：\n1. 严格保持风格：{style}\n2. 把任何书面腔、散文诗比喻、文言字眼（如“之、于、似、如”）和念起来拗口的长句，改成自然、顺口、短句为主的口播表达。\n3. 保持每个段落的 scene_ids、大致意思和总字数（约 {target_chars} 字）不变，不要编造新事实，也不要加“大家好”“画面中”。\n\n原稿：\n"
polish_ending = "\n只输出 JSON 数组，格式为 [{\"scene_ids\":[1,2],\"text\":\"...\"}]。"
