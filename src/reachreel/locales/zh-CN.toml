[script_md]
title = "{name} — 解说确认"
video = "- 视频：`{path}`"
language = "- 内容语言：{language}"
scenes = "- 场景数：{count}"
segments = "- 分段数：{count}"
characters = "- 总字数：{count}"
estimated = "- 预计旁白：{seconds:.1f}s / 视频 {video_seconds:.1f}s"
section = "## 分段"
table_header = "| # | 场景 | 开始 | 结束 | 文案 |"
section_edit = "## 如何继续"
edit_hint = "编辑 `script.json` 里的 `segments[].text`，然后运行 `reachreel tts {workdir}`，再继续 subtitle、mix、render。重新运行 `reachreel run <video> --workdir {workdir}` 也会复用改过的脚本。"

[review]
output = "- 成片：`{name}`  {width}x{height}  {duration:.1f}s"
subtitles = "- 字幕：`subtitles.srt`"
