table_header = "| # | 时间 | 文案 |"
section_edit = "## 修改方式"
edit_hint = "编辑 `script.json` 里的 `text`，然后用同一个 `--workdir` 重新运行。TTS 会按新文本重新配音，字幕和混音也会重做。"

