[script_md]
title = "{name} — script review"
video = "- Video: `{path}`"
language = "- Content language: {language}"
scenes = "- Scenes: {count}"
segments = "- Segments: {count}"
characters = "- Characters: {count}"
estimated = "- Estimated narration: {seconds:.1f}s / video {video_seconds:.1f}s"
section = "## Segments"
table_header = "| # | Scenes | Start | End | Text |"
section_edit = "## How to continue"
edit_hint = "Edit `segments[].text` in `script.json`, then run `reachreel tts {workdir}` and continue with subtitle, mix, and render. Rerunning `reachreel run <video> --workdir {workdir}` also reuses the edited script."

[review]
output = "- Output: `{name}`  {width}x{height}  {duration:.1f}s"
subtitles = "- Subtitles: `subtitles.srt`"
narration = "- Narration: {segments} segments, {characters} characters"
bgm = "- BGM: `{path}`"
bgm_none = "- BGM: none"
section_narration = "## Narration and placement"
table_header = "| # | Time | Text |"
section_edit = "## How to edit"
edit_hint = "Edit `text` in `script.json`, then rerun with the same `--workdir`. TTS re-synthesizes changed text, and subtitles and mixing are rebuilt."

