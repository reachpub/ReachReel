# Canonical UI catalog. New keys are added here first.

[cli]
description = "Local video narration pipeline: Ollama vision -> narration script -> Kokoro TTS -> Whisper subtitles -> BGM ducking -> FFmpeg render"
quickstart = """Quick start:
  reachreel doctor
  reachreel voices
  reachreel run video.mp4 --brief "Context about your clip" --review-script
  reachreel resume output/<job-dir>"""
video = "Path to the input video file"
workdir = "Explicit work directory (default: output/<video>_<timestamp>)"
workdir_pos = "Existing job work directory"
ollama_url = "Ollama server URL (default: http://localhost:11434)"
vlm_model = "Ollama vision model (default: qwen3-vl:8b-instruct)"
llm_model = "Ollama script-writing model (default: qwen3:30b-instruct)"
tts_engine = "TTS engine: kokoro (default), qwen3, or say"
whisper_model = "mlx-whisper model repo or local path"
asr = "Subtitle timing backend: mlx-whisper (default) or none (TTS timeline)"
no_bgm = "Disable background music mixing"
bgm_volume = "BGM base volume multiplier (default: 0.20)"
bgm_duck_db = "BGM ducking attenuation in dB during speech (default: -16.0)"
ambient_volume = "Original video ambient volume multiplier (default: 0.16)"
ambient_duck_db = "Ambient ducking attenuation in dB during speech (default: -10.0)"
target_lufs = "Target integrated loudness in LUFS (default: -14.0)"
resume = "Resume pending or stale stages in an existing work directory"
export_force = "Overwrite an existing export directory"
voices_preview = "Synthesize and play a short sample for the named voice"
voices_text = "Custom text to speak during --preview"
voices_out = "Save the --preview WAV file to this path"
voices_no_play = "Do not play the --preview audio automatically"
group_general = "General & Output"
group_script = "Script & Style"
group_tts = "Voiceover (TTS)"
group_subtitles = "Subtitles & Safe Area"
group_audio = "Audio & BGM"
group_vision = "Vision & Scene Analysis"
group_execution = "Execution & QA"
verbose = "Enable debug logging"
config = "TOML configuration file"
lang = "UI language (en or zh-CN)"
content_language = "Content language for narration and subtitles (zh or en)"
voice = "Voice name, e.g. zf_xiaoxiao/af_heart (Kokoro) or Serena/Vivian/Ryan (Qwen3); Kokoro supports comma mixing"
tts_language = "Voiceover language as a BCP 47 tag (en-US, en-GB, zh-CN); empty follows content_language"
qwen3_model = "Qwen3-TTS model repo or path (empty = auto CustomVoice-6bit or Base-bf16)"
tts_speed = "Base speech rate multiplier (default: 1.0)"
tts_instruct = "Delivery/emotion instruction for Qwen3 CustomVoice, or voice description for VoiceDesign"
tts_ref_audio = "Reference audio file (5-10s) for Qwen3 Base voice cloning"
tts_ref_text = "Exact transcript of --tts-ref-audio for high-fidelity cloning"
tts_temperature = "Generative TTS sampling temperature; 0 uses model default"
tts_top_p = "Generative TTS top-p sampling; 0 uses model default"
tts_top_k = "Generative TTS top-k sampling; 0 uses model default"
tts_repetition_penalty = "Generative TTS repetition penalty; 0 uses model default"
tts_seed = "Fixed RNG seed for reproducible TTS (>= 0); -1 is random"
tts_chunk_pause = "Silence pause in seconds between split chunks within one segment (default: 0.12)"
tts_pitch = "Pitch shift in semitones, e.g. -1.5 or +1.0 (default: 0.0)"
tts_volume = "Pre-mix narration gain multiplier (default: 1.0)"
vlm_workers = "VLM worker count (default: 2)"
vlm_frames = "Keyframes per scene (default: 3)"
vlm_dedup = "Drop near-duplicate keyframes below this difference (default: 4.0, 0 disables)"
scene_threshold = "Scene cut threshold (default: 0.32)"
style_preset = "Speaking style preset: oral (default), casual, literary, documentary, or commentary"
style = "Narration perspective, tone, and focus (overrides --style-preset)"
oral_polish = "Run or skip the spoken-delivery polish pass when generating the script"
brief = "Video context, such as the location, people, and what they did or said"
density = "Narration density from 0.2 to 1.0 (default: 0.62)"
max_speedup = "Maximum narration speed-up factor (default: 1.32)"
subtitle_size = "Subtitle size in output pixels (default: 48)"
subtitle_chars = "Maximum characters per subtitle line (default: follows content language, 18 zh / 42 en)"
subtitle_preset = "Platform safe-area preset (overrides the margin values)"
subtitle_render = "Subtitle look: outline (white text + black stroke, default), box (translucent black box), or none (plain white text)"
subtitle_outline = "Outline thickness in output pixels; 0 means auto (about 6%% of the font size)"
subtitle_box_padding = "Padding around the text in box mode, in output pixels; 0 means auto (about 6.7 px at 1920 height)"
subtitle_margin_v = "Bottom safe margin in pixels"
subtitle_margin_left = "Left safe margin in pixels"
subtitle_margin_right = "Right safe margin in pixels"
bgm = "Use a specific BGM file"
bgm_dir = "BGM directory (default: inputs/bgm)"
bgm_fade = "Fade the BGM out over the final N seconds (default: 2.0)"
run = "Run the full pipeline"
out = "Work directory root (default: output)"
height = "Output height, for example 1080 (default: keep source height)"
fps = "Output frame rate, for example 30 (default: keep source fps)"
no_burn = "Use soft subtitles instead of burning them in"
force = "Ignore existing intermediate artifacts"
no_resume = "Do not reuse scenes/script; VLM/TTS caches remain available"
no_qa = "Skip the QA gate"
qa_strict = "Return non-zero when QA reports warnings"
only = "Run only the selected stages, comma-separated: probe,vlm,script,tts,subtitles,mix,render,qa"
dry_run = "Print the plan without writing files"
review_script = "Stop after the script and write script.md for review"
analyze = "Run scene detection and VLM analysis only"
script = "Rewrite the narration script only"
tts = "Regenerate narration audio and timeline only"
subtitle = "Regenerate subtitles only"
mix = "Remix BGM, ambient audio, and narration only"
render = "Re-render from an existing work directory"
export = "Export an editing bundle from an existing work directory"
export_format = "Video format: H.264 MP4 (default) or ProRes 422 MOV"
export_narration_mode = "Narration layout in XML/FCPXML: track (single narration.wav, default) or segments (individual segment WAV clips)"
export_out = "New export directory (default: <workdir>/edit)"
export_fps = "Override the saved editing frame rate"
import_cmd = "Import edited artifacts (script, SRT, audio, cuts) or NLE XML/FCPXML back into a work directory"
import_script = "Import an edited script.json or script.md review table"
import_subtitles = "Import an edited SRT subtitle file"
import_narration = "Import a full narration audio track (converted to 48 kHz mono WAV)"
import_segment_audio = "Replace one segment's audio using ID=PATH (repeatable)"
import_bgm = "Import and bind a replacement BGM audio file"
import_cuts = "Import a cuts.json source video cut list"
import_timeline = "Import an edited FCP7 XML (.xml) or FCPXML (.fcpxml) timeline"
import_resume = "Automatically run the minimal affected downstream stages after import"
tune = "Fine-tune individual narration segments or source video cut ranges without editing JSON"
tune_group_segment = "Per-Segment Fine-Tuning (requires --segment)"
tune_group_cuts = "Lightweight Source Video Cuts (hard cuts only)"
tune_group_exec = "History & Execution"
tune_segment = "Target segment ID in script.json to fine-tune"
tune_text = "Replace the narration text for --segment"
tune_voice = "Override the voice for --segment (use 'default' to clear)"
tune_instruct = "Override the Qwen3 delivery instruction for --segment (use 'none' to clear)"
tune_speed = "Override speech rate for --segment (0.5-2.0, or 0 for default)"
tune_start = "Lock --segment start time in seconds or MM:SS (use 'auto' to clear)"
tune_gain_db = "Adjust --segment loudness gain in dB (-24.0 to +12.0)"
tune_enable = "Re-enable a previously disabled --segment"
tune_disable = "Disable --segment (skip TTS, narration track, and subtitles)"
tune_clear_audio = "Remove an imported audio_override on --segment so TTS runs again"
tune_cut = "Remove source video time ranges, e.g. '0-2.0,34.5-41.0'"
tune_keep = "Keep only these source video time ranges in order, e.g. '2.0-34.5,41.0-88.0'"
tune_reset_cuts = "Remove cuts.json and restore the full uncut source video"
tune_undo = "Restore the previous script.json / cuts.json snapshot from .history/"
tune_apply = "Automatically run the minimal affected downstream stages after tuning"
serve = "Launch the local ReachReel Studio fine-tuning web panel"
serve_workdir = "Optional job work directory to open directly"
serve_work_root = "Directory containing ReachReel job folders (default: output)"
serve_host = "Bind host address (default: 127.0.0.1)"
serve_port = "Bind port number (default: 8760; 0 picks a free port)"
serve_open = "Automatically open the studio panel in the default browser"
render_height = "Override output height"
render_fps = "Override output frame rate"
render_crf = "Override CRF; higher is smaller"
render_subtitle_size = "Override subtitle size in output pixels"
render_margin_v = "Override bottom safe margin"
render_margin_left = "Override left safe margin"
render_margin_right = "Override right safe margin"
qa = "Run the QA gate against an existing output"
qa_config = "Override manifest [qa] thresholds from a config file"
strict = "Return non-zero for warnings too"
json = "Print JSON"
status = "Inspect stage status and artifacts in an existing work directory"
doctor = "Check the local environment"
voices = "List built-in TTS voices and speaking style presets"
voices_tts = "Filter voices by TTS engine"
licenses = "Export the BGM license list for an existing work directory"
licenses_out = "Write the report here (default: <workdir>/licenses.md)"
cache = "Inspect or clean the shared cross-workdir cache"
cache_info = "Show the cache location and size"
cache_clean = "Delete the shared cache"
cache_clean_yes = "Confirm deletion"
cache_clean_dry = "Show what would be deleted"
cache_dir = "Shared cache directory (default: platform cache dir)"
