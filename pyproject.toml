[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reachreel"
version = "0.2.0"
description = "Fully local video narration pipeline: Ollama VLM -> script -> Kokoro TTS -> Whisper subtitles -> BGM ducking -> FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "mlx-audio>=0.6.7",
  "mlx-whisper>=0.4.3",
  "misaki[zh]>=0.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
# Maintainer tooling: `uv pip install -e '.[dev]'`. apdev brings the shared
# APCore checks (source charset, circular imports) and `apdev release`.
dev = [
  "apdev[dev]>=0.2.5",
]

[project.scripts]
reachreel = "reachreel.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reachreel"]

[tool.apdev]
base_package = "reachreel"
src_dir = "src"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
