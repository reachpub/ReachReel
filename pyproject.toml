[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reachreel"
version = "0.3.0"
description = "Fully local video narration pipeline: Ollama VLM -> script -> Kokoro TTS -> Whisper subtitles -> BGM ducking -> FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tercel" }]
keywords = [
  "video",
  "narration",
  "voiceover",
  "subtitles",
  "tts",
  "asr",
  "whisper",
  "kokoro",
  "mlx",
  "ollama",
  "ffmpeg",
  "local-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mlx-audio>=0.6.7",
  "mlx-whisper>=0.4.3",
  "misaki[zh]>=0.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
# Maintainer tooling: `uv pip install -e '.[dev]'`. apdev brings the shared
# APCore checks (source charset, circular imports) and `apdev release`.
dev = [
  "apdev[dev]>=0.2.6",
  "pre-commit>=3.5",
]

[project.scripts]
reachreel = "reachreel.cli.main:main"

[project.urls]
Homepage = "https://github.com/reachpub/ReachReel"
Repository = "https://github.com/reachpub/ReachReel"
Documentation = "https://github.com/reachpub/ReachReel/blob/main/docs/README.md"
Changelog = "https://github.com/reachpub/ReachReel/blob/main/CHANGELOG.md"
Issues = "https://github.com/reachpub/ReachReel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reachreel"]

[tool.apdev]
base_package = "reachreel"
src_dir = "src"
# Named ~/.pypirc section for `apdev release` (needs apdev >= 0.2.6).
pypi_repository = "reachreel"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
